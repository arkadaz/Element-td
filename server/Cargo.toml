[package]
name = "td-server"
version = "0.1.0"
edition = "2024"
description = "Elemental TD lobby server - stores room state, simulates nothing"

[dependencies]
td-proto = { path = "../proto" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Serves the compiled game next to the lobby, so one tiny container is the
# whole deployment and the client can derive its wss:// URL from its own origin.
tower-layer = "0.3"
tower-http = { version = "0.6", default-features = false, features = ["fs", "compression-gzip", "compression-br"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
