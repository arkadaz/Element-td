<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Green Circle TD</title>
  <meta name="description" content="A GPU-accelerated element tower defense written in pure Rust." />
  <base data-trunk-public-url />

  <link data-trunk rel="rust" data-wasm-opt="2"
        data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-mutable-globals --enable-reference-types --enable-multivalue --enable-simd" />
  <link data-trunk rel="copy-file" href="assets/favicon.svg" data-target-path="" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #101713; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    canvas#gamecanvas {
      position: fixed; inset: 0; width: 100vw; height: 100dvh;
      display: block; outline: none; touch-action: none;
    }
    /* This is deliberately HTML rather than a canvas hit region: browsers only
       grant fullscreen from a real user gesture. It never changes the canvas
       size itself; winit receives the ensuing resize and rebuilds targets. */
    #fullscreen-toggle {
      position: fixed;
      z-index: 20;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      min-width: 44px;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #b28e36;
      border-radius: 7px;
      color: #f3e4b0;
      background: rgba(10, 18, 16, .92);
      font: 600 12px/1 system-ui, sans-serif;
      letter-spacing: .04em;
      touch-action: manipulation;
    }
    #fullscreen-toggle:focus-visible { outline: 3px solid #7ec8ef; outline-offset: 2px; }
    /* The command card owns the lower-right edge while playing. Keep the
       browser-only fullscreen control in the scene margin instead of covering
       purchasable tower slots. */
    html[data-green-td-screen="playing"] #fullscreen-toggle {
      top: max(52px, env(safe-area-inset-top));
      bottom: auto;
    }
    /* On a narrow touch viewport placement owns the upper scene edge for its
       short Cancel hint. Fullscreen remains available from the visible Menu
       overflow, but must not sit on top of that player instruction. */
    @media (max-width: 620px) {
      html[data-green-td-screen="playing"][data-green-td-armed="true"] #fullscreen-toggle {
        display: none;
      }
    }
    /* Boot splash - removed by the app once the first frame is painted. */
    #boot {
      position: absolute; inset: 0; display: grid; place-content: center; gap: 14px;
      justify-items: center; color: #8e9ab5; z-index: 10;
      background: radial-gradient(900px 600px at 50% 40%, #131a2c 0%, #05060a 70%);
    }
    #boot h1 {
      margin: 0; font-size: 28px; letter-spacing: .28em; text-transform: uppercase;
      color: #e6ecf7; font-weight: 700;
    }
    #boot .bar { width: 220px; height: 3px; background: #1d2436; border-radius: 2px; overflow: hidden; }
    #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 2px;
      background: linear-gradient(90deg, #ff7328, #4aaeff, #b36bff);
      animation: slide 1.1s ease-in-out infinite; }
    #boot small { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
    @keyframes slide { 0% { transform: translateX(-110%);} 100% { transform: translateX(260%);} }
  </style>
  <script>
    // A renderer or shader failure must never collapse into a silent black
    // screen. The Rust boot path replaces this text with its own detailed
    // adapter error when it can; this catches later panics and device loss.
    function showBootFailure(reason) {
      const boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.display = 'grid';
      boot.innerHTML = '<h1>Green Circle TD</h1><small style="max-width:680px;line-height:1.6;text-align:center;color:#ff9b84">' +
        String(reason || 'The graphics device stopped responding.') +
        '<br><br>Reload once. If this repeats, enable hardware acceleration in Edge settings and restart Edge.</small>';
    }
    window.addEventListener('error', event => showBootFailure(event.message));
    window.addEventListener('unhandledrejection', event => showBootFailure(event.reason));
    window.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('fullscreen-toggle');
      const sync = () => {
        const supported = !!document.documentElement.requestFullscreen;
        button.hidden = !supported;
        button.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
        button.setAttribute('aria-label', button.textContent);
      };
      button.addEventListener('click', async event => {
        event.preventDefault();
        event.stopPropagation();
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch (_) {
          // Normal viewport filling remains the supported fallback when the
          // browser declines fullscreen (for example embedded webviews).
          sync();
        }
      });
      document.addEventListener('fullscreenchange', sync);
      sync();
    });
  </script>
</head>
<body>
  <canvas id="gamecanvas"></canvas>
  <button id="fullscreen-toggle" type="button" aria-label="Full screen">Full screen</button>
  <div id="boot">
    <h1>Green Circle TD</h1>
    <div class="bar"><i></i></div>
    <small>compiling shaders &middot; rust + wgpu</small>
  </div>
</body>
</html>
