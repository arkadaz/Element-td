[workspace]
members = ["proto", "server"]

[package]
name = "green_circle_td"
version = "0.1.0"
edition = "2024"
description = "Green Circle TD - the Warcraft III map, ported to Rust and wgpu"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.36"
# Only used by the glyph-coverage test, which has to ask the font atlas
# directly whether a character exists.
epaint = "0.36"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
td-proto = { path = "proto" }
ewebsock = "0.8"
wgpu = { version = "30", default-features = false, features = ["wgsl", "webgl", "webgpu", "dx12", "vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AudioBuffer", "AudioBufferSourceNode", "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "BiquadFilterNode", "BiquadFilterType", "Document", "Element", "GainNode", "HtmlCanvasElement", "Location", "OscillatorNode", "OscillatorType", "Performance", "Storage", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

# Dev builds still need to run at 60 fps, so optimise dependencies even in debug.
[profile.dev]
opt-level = 1
# Debug symbols balloon the wasm to ~190 MB; keep them off for web dev builds.
debug = false

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
